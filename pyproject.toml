[project]
name = "pianolens"
version = "0.1.0"
description = "Scoring piano performances: correctness, control, shaping, interpretation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "partitura>=1.6",
  "parangonar>=2.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "statsmodels>=0.14",
  "factor-analyzer>=0.5",
  "matplotlib>=3.9",
  "mido>=1.3",
  "pretty-midi>=0.2.10",
  "music21>=9.1",
  "pyyaml>=6",
  "tqdm>=4.66",
  "requests>=2.32",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
torch = ["torch>=2.8", "torchaudio>=2.8", "muq>=0.1.0", "transformers>=4.45,<5"]
audio = ["librosa>=0.10.2", "soundfile>=0.12", "pyloudnorm>=0.1.1", "soxr>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pianolens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
